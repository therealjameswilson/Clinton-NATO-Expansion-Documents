<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clinton NATO Expansion Documents v2.0</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Barton Bernstein document package</p>
        <h1>Version 2.0: Explicit NATO Membership Expansion</h1>
      </div>
      <nav class="links" aria-label="Version links">
        <a href="../">Version 1.0</a>
        <a href="../reports/version-2-explicit-expansion.md">V2 Report</a>
        <a href="../data/version-2-explicit-expansion.csv">V2 CSV</a>
        <a href="../data/version-2-explicit-expansion.json">V2 JSON</a>
      </nav>
    </header>

    <main>
      <section class="metrics" aria-label="Version 2 metrics">
        <div class="metric">
          <span class="metric-value" id="recordCount">0</span>
          <span class="metric-label">core records</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="pageCount">0</span>
          <span class="metric-label">core pages</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="nscCount">0</span>
          <span class="metric-label">NSC/SOC flags</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="reviewCount">0</span>
          <span class="metric-label">review queue</span>
        </div>
      </section>

      <section class="toolbar" aria-label="Version 2 filters">
        <label>
          Search
          <input id="searchInput" type="search" autocomplete="off">
        </label>
        <label>
          Lane
          <select id="laneFilter">
            <option value="">All</option>
          </select>
        </label>
        <label>
          Source
          <select id="sourceFilter">
            <option value="">All</option>
          </select>
        </label>
        <label class="toggle">
          <input id="nscOnly" type="checkbox">
          NSC/SOC only
        </label>
      </section>

      <section class="table-wrap" aria-label="Version 2 dossier">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Lane</th>
              <th>Record</th>
              <th>Type</th>
              <th>Source</th>
              <th>Pages</th>
              <th>Match</th>
            </tr>
          </thead>
          <tbody id="recordRows"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
