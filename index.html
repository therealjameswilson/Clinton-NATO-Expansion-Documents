<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clinton NATO Expansion Documents</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Barton Bernstein document package</p>
        <h1>Clinton NATO Expansion Documents</h1>
      </div>
      <nav class="links" aria-label="Source links">
        <a href="reports/assembly-plan.md">Assembly Plan</a>
        <a href="reports/nsc-soc-priority-queue.md">NSC Queue</a>
        <a href="data/source-register.json">Register JSON</a>
      </nav>
    </header>

    <main>
      <section class="metrics" aria-label="Register metrics">
        <div class="metric">
          <span class="metric-value" id="recordCount">0</span>
          <span class="metric-label">records</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="knownPages">0</span>
          <span class="metric-label">known pages</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="nscCount">0</span>
          <span class="metric-label">NSC/SOC flags</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="p0Count">0</span>
          <span class="metric-label">P0 records</span>
        </div>
      </section>

      <section class="toolbar" aria-label="Register filters">
        <label>
          Search
          <input id="searchInput" type="search" autocomplete="off">
        </label>
        <label>
          Priority
          <select id="priorityFilter">
            <option value="">All</option>
            <option value="P0">P0</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
          </select>
        </label>
        <label>
          Source
          <select id="sourceFilter">
            <option value="">All</option>
          </select>
        </label>
        <label class="toggle">
          <input id="nscOnly" type="checkbox">
          NSC/SOC only
        </label>
      </section>

      <section class="table-wrap" aria-label="Source register">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Priority</th>
              <th>Record</th>
              <th>Type</th>
              <th>Source</th>
              <th>Pages</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="recordRows"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
